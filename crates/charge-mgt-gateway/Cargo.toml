[package]
name = "charge_mgt_gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json.workspace = true
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = "0.3"
chrono = { workspace = true }
uuid = { workspace = true }
rand = { workspace = true }

tokio-tungstenite = "0.21"
futures-util = "0.3"

reqwest = { version = "0.11", features = ["json"] }
config = "0.14"

# TLS 协议层（rustls 纯 Rust 实现，避免 OpenSSL 系统依赖）
rustls = { version = "0.23", default-features = false, features = ["std", "logging"] }
rustls-pemfile = "2.2"
tokio-rustls = "0.26"

# Basic Auth：密码哈希（OWASP 推荐 argon2id）+ base64 解码
argon2 = "0.5"
base64 = "0.22"

# Kafka
rdkafka = { version = "0.36", features = ["cmake-build"] }

# Redis (条件依赖，response_channel = redis 模式时使用)
redis = { version = "0.25", features = ["aio", "tokio-comp"] }

ocpp_1_6 = { path = "../ocpp-1-6" }
ocpp_2_0_1 = { path = "../ocpp-2-0-1" }
ocpp_2_1 = { path = "../ocpp-2-1" }
charge-mgt-common = { path = "../charge-mgt-common" }

[dev-dependencies]
tokio = { workspace = true }