gateway:
  id: "gateway-001"
  host: "192.168.1.100"

device:
  listen_addr: "0.0.0.0"
  listen_port: 9000

cloud:
  api_url: "https://cloud.example.com"
  # 内网 API 共享密钥（必须与 cloud 端 cloud.api_key 完全一致）
  # 用于 Basic Auth 密码验证的 /internal/auth/verify 调用
  api_key: "internal-shared-secret-CHANGEME"

# 响应通道模式: "redis" (BLPOP 同步等待) 或 "kafka" (Consumer + PendingTracker)
response_channel: "kafka"

redis:
  url: "redis://127.0.0.1:6379"
  response_timeout_secs: 5
  key_ttl_secs: 10

kafka:
  brokers: "127.0.0.1:9092"
  topic_prefix: "charge_mgt"
  # 上行 topic 后缀 (充电桩请求 → 云平台)
  req_topic_suffix: "req"
  # 下行 topic 后缀 (云平台响应+命令 → Gateway), 仅 kafka 模式使用
  resp_topic_suffix: "resp"
  # 云平台命令 topic 后缀, 仅 redis 模式使用 (kafka 模式合并在 resp 中)
  cmd_topic_suffix: "cmd"
  # 响应超时秒数, 仅 kafka 模式使用
  response_timeout_secs: 30

# OCPP 1.6 链路安全配置（6 种模式）
# 模式映射（auth_mode × tls.enabled × tls.mtls）：
#   none              + tls:off                 → 模式 1：明文无认证（内部/调试）
#   none              + tls:on                  → 模式 3：TLS 无认证
#   basic             + tls:off                 → 模式 2：明文 Basic（仅过渡）
#   basic             + tls:on + mtls:off       → 模式 4：TLS + Basic（主流生产）
#   mtls              + tls:on + mtls:on        → 模式 5：TLS + mTLS（高安全）
#   mtls-with-basic  + tls:on + mtls:on        → 模式 6：TLS + mTLS + Basic（最高安全）
ocpp_security:
  auth_mode: "none"      # none / basic / mtls / mtls-with-basic
  tls:
    enabled: false         # false = 明文 ws://；true = 加密 wss://
    cert_path: "crates/charge-mgt-gateway/certs/server-cert.pem"
    key_path: "crates/charge-mgt-gateway/certs/server-key.pem"
    # mTLS（仅模式 5/6 必填；CA 证书用于验证桩客户端证书）
    mtls:
      ca_cert_path: "crates/charge-mgt-gateway/certs/ca-cert.pem"
      client_auth: "required"   # required / optional
