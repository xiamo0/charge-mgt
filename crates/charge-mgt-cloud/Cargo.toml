[package]
name = "charge_mgt_cloud"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "charge_mgt_cloud"
path = "src/main.rs"

[features]
default = ["message_by_http","ocpp_1_6"]
message_by_http = []
message_by_mq = []
ocpp_1_6 = []
ocpp_2_0_1 = []
ocpp_2_1 = []

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json.workspace = true
serde_repr.workspace = true
axum.workspace = true
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { workspace = true }
rust_decimal.workspace = true

# OCPP 消息结构（复用）
ocpp_1_6 = { path = "../ocpp-1-6" }
charge-mgt-common = { path = "../charge-mgt-common" }

# 数据库（PG + sea-orm）
sea-orm.workspace = true

# 项目内 migration crate（等价原 SQL 迁移）
migration = { path = "migration" }

# Kafka（复用 gateway 的版本，保证消息体互操作）
rdkafka = { version = "0.36", features = ["cmake-build"] }
futures = { version = "0.3", default-features = false, features = ["std"] }
dashmap = { workspace = true }

# 配置加载
config = "0.14"

# 错误处理（anyhow for application-level errors; thiserror for typed errors）
anyhow = "1"

reqwest = { workspace = true }

# 密码哈希（Basic Auth 桩身份验证 + 管理 API 账号）
argon2 = "0.5"
# JWT（HTTP 管理 API 鉴权）
jsonwebtoken = "9"
# 盐生成
rand = "0.8"

[dev-dependencies]
tokio = { workspace = true }
sea-orm = { workspace = true, features = ["mock"] }