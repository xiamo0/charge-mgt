cloud:
  id: "cloud-001"
  http_listen_addr: "0.0.0.0"
  http_listen_port: 8000

database:
  url: "postgres://charge_mgt:charge_mgt_dev@127.0.0.1:5432/charge_mgt_cloud"
  max_connections: 10

kafka:
  brokers: "127.0.0.1:9092"
  consumer_group: "charge-mgt-cloud-consumer"
  topic_prefix: "charge_mgt"
  # req_topics 留空 = 自动发现所有 charge_mgt.req.* 话题（无需重启加 vendor）
  req_topics:
    []
  # 也可显式列出：
  #   - "charge_mgt.req.Alphas"
